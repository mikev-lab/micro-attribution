name: Deploy & Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  validate-and-release:
    name: Validate, Package & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22.x LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Governance Compliance
        run: npm run test:compliance

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Execute Full Test Suite
        run: npm test

      - name: Build Production Distributions (ESM, CJS, IIFE)
        run: npm run build

      - name: Verify Modular Bundle Budgets (< 2.5 KB min+gzip per module)
        run: |
          gzip -c dist/attribution.js > dist/attribution.js.gz
          ATTR_SIZE=$(wc -c < dist/attribution.js.gz | tr -d ' ')
          echo "Attribution Module gzip size: ${ATTR_SIZE} bytes"
          if [ "$ATTR_SIZE" -gt 2560 ]; then
            echo "ERROR: Attribution bundle budget exceeded (max 2560 bytes, current ${ATTR_SIZE} bytes)"
            exit 1
          fi

          gzip -c dist/privacy.js > dist/privacy.js.gz
          PRIV_SIZE=$(wc -c < dist/privacy.js.gz | tr -d ' ')
          echo "Privacy Module gzip size: ${PRIV_SIZE} bytes"
          if [ "$PRIV_SIZE" -gt 2560 ]; then
            echo "ERROR: Privacy bundle budget exceeded (max 2560 bytes, current ${PRIV_SIZE} bytes)"
            exit 1
          fi

      - name: Create GitHub Release & Upload Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/index.global.js
            dist/index.global.js.map
            dist/index.js
            dist/index.cjs
            dist/index.d.ts
            dist/attribution.js
            dist/attribution.cjs
            dist/attribution.d.ts
            dist/privacy.js
            dist/privacy.cjs
            dist/privacy.d.ts
          generate_release_notes: true

      - name: Publish to NPM Registry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            npm publish --provenance --access public
          else
            echo "NPM_TOKEN not configured; skipping npm publish."
          fi
