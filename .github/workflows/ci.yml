name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Typecheck & Test Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Governance Compliance
        run: npm run test:compliance

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Comprehensive Unit & Integration Tests
        run: npm test

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Bundle Budget (< 2.5 KB min+gzip)
        run: |
          gzip -c dist/index.global.js > dist/index.global.js.gz
          SIZE=$(wc -c < dist/index.global.js.gz | tr -d ' ')
          echo "Client Core IIFE gzip size: ${SIZE} bytes"
          if [ "$SIZE" -gt 2560 ]; then
            echo "ERROR: Bundle budget exceeded (max 2560 bytes, current ${SIZE} bytes)"
            exit 1
          fi
