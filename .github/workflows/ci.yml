name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Typecheck & Test Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Governance Compliance
        run: npm run test:compliance

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Comprehensive Unit & Integration Tests
        run: npm test

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Modular Bundle Budgets (< 2.5 KB min+gzip per module)
        run: |
          gzip -c dist/attribution.js > dist/attribution.js.gz
          ATTR_SIZE=$(wc -c < dist/attribution.js.gz | tr -d ' ')
          echo "Attribution Module gzip size: ${ATTR_SIZE} bytes"
          if [ "$ATTR_SIZE" -gt 2560 ]; then
            echo "ERROR: Attribution bundle budget exceeded (max 2560 bytes, current ${ATTR_SIZE} bytes)"
            exit 1
          fi

          gzip -c dist/privacy.js > dist/privacy.js.gz
          PRIV_SIZE=$(wc -c < dist/privacy.js.gz | tr -d ' ')
          echo "Privacy Module gzip size: ${PRIV_SIZE} bytes"
          if [ "$PRIV_SIZE" -gt 2560 ]; then
            echo "ERROR: Privacy bundle budget exceeded (max 2560 bytes, current ${PRIV_SIZE} bytes)"
            exit 1
          fi
