name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Typecheck & Test Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npm run typecheck

      - name: Comprehensive Unit & Integration Tests
        run: npm test

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Modular Bundle Budgets (< 2.5 KB min+gzip per module)
        run: |
          gzip -c dist/attribution.js > dist/attribution.js.gz
          ATTR_SIZE=$(wc -c < dist/attribution.js.gz | tr -d ' ')
          echo "Attribution Module gzip size: ${ATTR_SIZE} bytes"
          if [ "$ATTR_SIZE" -gt 2560 ]; then
            echo "ERROR: Attribution bundle budget exceeded (max 2560 bytes, current ${ATTR_SIZE} bytes)"
            exit 1
          fi

          gzip -c dist/privacy.js > dist/privacy.js.gz
          PRIV_SIZE=$(wc -c < dist/privacy.js.gz | tr -d ' ')
          echo "Privacy Module gzip size: ${PRIV_SIZE} bytes"
          if [ "$PRIV_SIZE" -gt 2560 ]; then
            echo "ERROR: Privacy bundle budget exceeded (max 2560 bytes, current ${PRIV_SIZE} bytes)"
            exit 1
          fi

          gzip -c dist/storage.js > dist/storage.js.gz
          STOR_SIZE=$(wc -c < dist/storage.js.gz | tr -d ' ')
          echo "Storage Module gzip size: ${STOR_SIZE} bytes"
          if [ "$STOR_SIZE" -gt 2560 ]; then
            echo "ERROR: Storage bundle budget exceeded (max 2560 bytes, current ${STOR_SIZE} bytes)"
            exit 1
          fi

          gzip -c dist/queue.js > dist/queue.js.gz
          QUEUE_SIZE=$(wc -c < dist/queue.js.gz | tr -d ' ')
          echo "Queue Module gzip size: ${QUEUE_SIZE} bytes"
          if [ "$QUEUE_SIZE" -gt 2560 ]; then
            echo "ERROR: Queue bundle budget exceeded (max 2560 bytes, current ${QUEUE_SIZE} bytes)"
            exit 1
          fi

          gzip -c dist/transport.js > dist/transport.js.gz
          TRANS_SIZE=$(wc -c < dist/transport.js.gz | tr -d ' ')
          echo "Transport Module gzip size: ${TRANS_SIZE} bytes"
          if [ "$TRANS_SIZE" -gt 2560 ]; then
            echo "ERROR: Transport bundle budget exceeded (max 2560 bytes, current ${TRANS_SIZE} bytes)"
            exit 1
          fi

          gzip -c dist/edge.js > dist/edge.js.gz
          EDGE_SIZE=$(wc -c < dist/edge.js.gz | tr -d ' ')
          echo "Edge Module gzip size: ${EDGE_SIZE} bytes"
          if [ "$EDGE_SIZE" -gt 2560 ]; then
            echo "ERROR: Edge bundle budget exceeded (max 2560 bytes, current ${EDGE_SIZE} bytes)"
            exit 1
          fi
