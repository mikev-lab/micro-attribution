name: Deploy GitHub Pages Playground

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "package.json"
      - "tsup.config.ts"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production distribution bundles
        run: npm run build

      - name: Prepare distribution artifacts for static playground
        run: |
          mkdir -p docs/dist
          cp dist/index.global.js docs/dist/index.global.js
          cp dist/index.global.js.map docs/dist/index.global.js.map

      - name: Setup GitHub Pages configuration
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
